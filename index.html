<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Madhav's Interactive Badminton Match</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
		<h1>Madhav's Badminton Match Dashboard</h1>
		<p>UofT Tournament - Madhav vs Aadi</p>
	</header>

    <main>
        <section id="match-info">
            <h2>Match Information</h2>
            <p class="p">Player 1: Madhav</p>
            <p class="p">Player 2: Aadi</p>
            <p class="p" id="score">
                Madhav: 0 | Aadi: 0
            </p>
            <p id="match-status">
                Match Status: Not Started
            </p>

        </section>

        <section id="event-log">
            <h2>Event Log</h2>
            <ul id="events">
                <!-- Events will be dynamically added here -->
                <li>Waiting for the match to start.</li>
            </ul>
        </section>

        <section id="controls">
        <h2>Controls</h2>

        <button id="start-match">Start Match</button>

        <button id="madhav-point">Point for Madhav</button>

        <button id="aadi-point">Point for Aadi</button>

        <button id="end-match">Game Over</button>
         </section>

    </main>

    <footer>
        <p>Events in Motion</p>
        <p>CCT360 - Web Development and Design II</p>
    </footer>

    <script src="index.js"></script>

</body>
</html>
